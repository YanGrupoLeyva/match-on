name: One-shot hero patch
on:
  push:
    paths:
      - '.github/workflows/patch-hero.yml'
      - '.github/patch_hero.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hero ecosystem
        run: python3 .github/patch_hero.py
      - name: Commit patch
        run: |
          git config user.name "YanGrupoLeyva"
          git config user.email "97878905+YanGrupoLeyva@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Alinea el núcleo conectado del hero"
          git push origin main
